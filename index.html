<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nairobi International Christian Church Campus Ministry — Faith, Fellowship and Purpose for university students in Nairobi."
    />
    <!-- Preconnect to the cloud API so the first fetch skips DNS+TLS setup. -->
    <link rel="preconnect" href="https://nicc-campus-api.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://nicc-campus-api.onrender.com" />
    <!-- Preload the mobile hero image (LCP) so it starts before the JS bundle. -->
    <link
      rel="preload"
      as="image"
      href="/images/campus-homepage-480.webp"
      imagesrcset="/images/campus-homepage-480.webp 480w, /images/campus-homepage-768.webp 768w, /images/campus-homepage-1054.webp 1054w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <title>NICC Campus Ministry | Faith, Fellowship & Purpose</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
